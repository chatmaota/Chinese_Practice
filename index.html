<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chinese Practice Studio</title>
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7/dist/hanzi-writer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.26.0/dist/index.js"></script>
<style>
:root{--red:#a92323;--red2:#d94a45;--pink:#fff1ee;--cream:#fffaf5;--ink:#302827;--line:#edc8c2;--muted:#806e69}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Arial,"Noto Sans Thai","Microsoft YaHei",sans-serif;background:
radial-gradient(circle at 8% 8%,#efaaa055 0 2px,transparent 3px),
linear-gradient(135deg,#fff7f3,#fde8e3 55%,#fff9f4)}
body:before,body:after{content:"福";position:fixed;font-family:serif;color:#b9282810;font-size:240px;z-index:-1}
body:before{left:-40px;bottom:-60px}body:after{right:-20px;top:20px}
.wrap{max-width:1180px;margin:auto;padding:18px}.hero{background:#fff9f5dd;border:1px solid var(--line);border-radius:22px;padding:20px 24px;box-shadow:0 10px 35px #8f1e1510;position:relative;overflow:hidden}
.hero:after{content:"梅  ·  学  ·  福";position:absolute;right:25px;top:20px;color:#b52d2d30;font-size:26px}.title{font-family:Georgia,"KaiTi",serif;color:#8f1d1d;font-size:34px;margin:0}.sub{color:var(--muted);margin-top:6px}
.view{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.view button.active{background:var(--red);color:#fff}
.grid{display:grid;grid-template-columns:390px 1fr;gap:16px;margin-top:16px}.card{background:#fffaf8eF;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 28px #8f1e1510}
h2{font-size:18px;color:#922525;margin:0 0 13px}.step{display:inline-grid;place-items:center;background:var(--red);color:#fff;width:27px;height:27px;border-radius:50%;margin-right:8px}
textarea,input[type=text]{width:100%;border:1px solid #dfc3bd;border-radius:12px;background:#fff;padding:13px 14px;font-size:20px;font-family:inherit;outline:none}
textarea{height:100px;resize:vertical}button{border:0;border-radius:11px;padding:11px 14px;background:linear-gradient(135deg,var(--red),var(--red2));color:white;font-size:15px;cursor:pointer}
button.soft{background:#f8e6e2;color:#7e2525;border:1px solid #edcbc4}.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:11px}.full{width:100%;margin-top:10px}
.result{padding:18px;background:linear-gradient(135deg,#fff,#fff0ec);border:1px solid #efc4bd;border-radius:16px;margin-bottom:15px}.big{font-family:"KaiTi","STKaiti","Microsoft YaHei";font-size:50px;font-weight:700;color:#922525;line-height:1.25}.pin{font-size:24px;font-weight:700;margin-top:7px}.status{font-size:14px;font-weight:700;margin-top:10px;min-height:18px}.err{color:#b42318}.ok{color:#067647}
.chars{display:flex;gap:10px;flex-wrap:wrap}.char{width:126px;text-align:center}.box{width:126px;height:126px;background:#fff;border:1px solid #e2c8c3;border-radius:12px}.cl{font-size:23px;font-weight:bold;margin-top:5px}.cp{font-size:13px;color:#76635f}
.opts{display:grid;gap:12px;margin-top:15px}.opt{display:flex;align-items:center;justify-content:space-between;gap:10px}.tip{margin-top:15px;padding:14px;border-radius:13px;background:#fff0eb;border-left:4px solid var(--red2);line-height:1.55}
body.mobile .grid{grid-template-columns:1fr;max-width:620px;margin:16px auto}body.mobile .wrap{max-width:660px}body.mobile .big{font-size:42px}body.mobile .char{width:105px}body.mobile .box{width:105px;height:105px}
body.desktop .grid{grid-template-columns:390px 1fr}
@media(max-width:760px){.grid{grid-template-columns:1fr}.title{font-size:29px}.hero:after{display:none}.big{font-size:39px}.char{width:102px}.box{width:102px;height:102px}.pin{font-size:20px}}
</style>
</head><body>
<div class="wrap">
<header class="hero">
<h1 class="title">学 Chinese Practice Studio</h1>
<div class="sub">พิมพ์ภาษาไทย → ภาษาจีน → Pinyin → ลำดับขีด → ฝึกเขียนตาม　🌸 学无止境</div>
<div class="view"><button class="soft" id="autoV" onclick="setView('auto')">↔ อัตโนมัติ</button><button class="soft" id="mobV" onclick="setView('mobile')">📱 มือถือ</button><button class="soft" id="deskV" onclick="setView('desktop')">🖥️ คอม</button></div>
</header>

<main class="grid">
<section class="card">
<h2><span class="step">1</span>ภาษาไทย</h2>
<textarea id="thai">ผมทำงานที่โรงงาน</textarea>
<div class="row"><button style="flex:1" onclick="translateThai()">文 แปลเป็นภาษาจีน</button><button class="soft" onclick="clearAll()">✕ Clear</button></div>
<div id="transStatus" class="status"></div>

<h2 style="margin-top:22px"><span class="step">2</span>ภาษาจีน</h2>
<input id="txt" type="text" value="我在工厂工作。">


<h2 style="margin-top:22px"><span class="step">3</span>ตัวเลือก</h2>
<div class="opts">
<div class="opt"><span>ความเร็วการเขียน</span><input id="spd" type="range" min=".5" max="2.5" step=".1" value="1.2" style="width:150px"></div>
<div class="opt"><span>แสดงเส้นโครง</span><input id="outline" type="checkbox" checked onchange="build()"></div>
</div>
<div class="row"><button onclick="play()">▶ วาดทั้งหมด</button><button class="soft" onclick="loop()">↻ เล่นวน</button><button class="soft" onclick="stopLoop()">■ หยุด</button></div>
<div class="row"><button class="soft" onclick="quiz()">✎ เขียนตาม</button><button class="soft" onclick="speak()">🔊 ฟังเสียงจีน</button></div>
<div class="tip"><b>坚持 · ฝึกทีละนิดทุกวัน</b><br>คลิกตัวอักษรด้านขวาเพื่อดู Stroke Animation เฉพาะตัวได้</div>
</section>

<section class="card">
<div class="result"><div style="color:#9c2d2d;font-weight:bold">ผลลัพธ์ 结果</div><div id="big" class="big">我在工厂工作。</div><div id="pinyin" class="pin">wǒ zài gōngchǎng gōngzuò。</div></div>
<h2>字 ตัวอักษรและลำดับขีด</h2><div id="chars" class="chars"></div><div id="status" class="status"></div>
</section>
</main>
</div>
<script>
let writers=[], looping=false, gen=0;
const hz=/[\u3400-\u9FFF\uF900-\uFAFF]/;
function setView(v){document.body.classList.remove('mobile','desktop');document.querySelectorAll('.view button').forEach(x=>x.classList.remove('active'));if(v!=='auto'){document.body.classList.add(v);document.getElementById(v==='mobile'?'mobV':'deskV').classList.add('active')}else autoV.classList.add('active');localStorage.setItem('view',v);build()}
function updatePinyin(){try{pinyin.textContent=pinyinPro.pinyin(txt.value,{toneType:'symbol',type:'string',nonZh:'consecutive'})}catch(e){pinyin.textContent=''}}
function clearAll(){
 looping=false; thai.value=''; txt.value=''; transStatus.textContent='';
 big.textContent=''; pinyin.textContent=''; chars.innerHTML='';
 status.textContent=''; writers=[]; thai.focus();
}
async function translateThai(){
 let q=thai.value.trim();if(!q)return;
 transStatus.textContent='กำลังแปล…';
 /* Static fallbacks keep common study phrases usable even if an online translator is blocked. */
 const local={"ผมทำงานที่โรงงาน":"我在工厂工作。","ฉันทำงานที่โรงงาน":"我在工厂工作。","ผมเป็นวิศวกร":"我是一名工程师。","ฉันเป็นวิศวกร":"我是一名工程师。","ผมชอบเรียนภาษาจีน":"我喜欢学习中文。","ฉันชอบเรียนภาษาจีน":"我喜欢学习中文。","สวัสดี":"你好。","ขอบคุณ":"谢谢。"};
 if(local[q]){txt.value=local[q];transStatus.innerHTML='<span class="ok">✓ แปลสำเร็จ (Offline)</span>';build();return}
 try{
  let u='https://translate.googleapis.com/translate_a/single?client=gtx&sl=th&tl=zh-CN&dt=t&q='+encodeURIComponent(q);
  let r=await fetch(u);if(!r.ok)throw 0;let d=await r.json();let z=(d[0]||[]).map(x=>x[0]||'').join('');
  if(!z)throw 0;txt.value=z;transStatus.innerHTML='<span class="ok">✓ แปลสำเร็จ</span>';build()
 }catch(e){transStatus.innerHTML='<span class="err">เบราว์เซอร์บล็อกบริการแปลออนไลน์ — ช่องจีนยังใช้ Pinyin / Stroke / เสียง / Quiz ได้ตามปกติ</span>'}
}
function build(){
 looping=false;writers=[];gen++;big.textContent=txt.value;updatePinyin();chars.innerHTML='';
 let a=[...txt.value].filter(c=>hz.test(c));let size=(document.body.classList.contains('mobile')||innerWidth<=760)?102:126;
 a.forEach((c,i)=>{let d=document.createElement('div');d.className='char';let b=document.createElement('div');b.className='box';b.id='h'+gen+'_'+i;let l=document.createElement('div');l.className='cl';l.textContent=c;let pp=document.createElement('div');pp.className='cp';try{pp.textContent=pinyinPro.pinyin(c,{toneType:'symbol'})}catch(e){}d.append(b,l,pp);chars.appendChild(d);
 let w=HanziWriter.create(b.id,c,{width:size,height:size,padding:8,showOutline:outline.checked,showCharacter:false,strokeAnimationSpeed:+spd.value,delayBetweenStrokes:180,strokeColor:'#8f2424',outlineColor:'#ead7d2',highlightColor:'#df615a'});writers.push(w);b.onclick=()=>w.animateCharacter()});
 status.textContent='พร้อมฝึก '+a.length+' ตัวอักษร';
}
function one(w){return new Promise(r=>w.animateCharacter({onComplete:()=>setTimeout(r,180)}))}
async function play(){looping=false;for(let w of writers)await one(w)}
async function loop(){looping=true;while(looping){for(let w of writers){if(!looping)break;await one(w)}if(looping)await new Promise(r=>setTimeout(r,500))}}
function stopLoop(){looping=false}
async function quiz(){looping=false;for(let w of writers)await new Promise(r=>w.quiz({showHintAfterMisses:2,onComplete:()=>setTimeout(r,180)}))}
function speak(){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(txt.value);u.lang='zh-CN';u.rate=.8;let vs=speechSynthesis.getVoices(),v=vs.find(x=>x.lang&&x.lang.toLowerCase().startsWith('zh'));if(v)u.voice=v;speechSynthesis.speak(u)}
let rebuildTimer;
txt.addEventListener('input',()=>{big.textContent=txt.value;updatePinyin();clearTimeout(rebuildTimer);rebuildTimer=setTimeout(build,250)});
let saved=localStorage.getItem('view')||'auto';setView(saved);
</script></body></html>
